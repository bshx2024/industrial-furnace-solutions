<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EcoReheating | Zero-CAPEX Steel Mill Reheating Furnace Energy Saving</title>
  <meta name="description"
    content="Cut reheating furnace fuel costs by 7-15% with zero upfront investment. Specialized energy performance contracting for walking beam and pusher furnaces in steel rolling mills." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Oswald:wght@500;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            industrial: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            },
            furnace: {
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              950: '#431407',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Oswald', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Oswald', sans-serif;
    }

    /* CORE INDUSTRIAL ANIMATIONS */
    @keyframes industrial-zoom {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes industrial-heat {
      0% {
        filter: brightness(1) contrast(1);
        opacity: 0.6;
      }

      50% {
        filter: brightness(1.3) contrast(1.2);
        opacity: 0.8;
      }

      100% {
        filter: brightness(1) contrast(1);
        opacity: 0.6;
      }
    }

    @keyframes industrial-scan {
      0% {
        top: -20%;
        opacity: 0;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        top: 120%;
        opacity: 0;
      }
    }

    .engine-bg-animate {
      animation: industrial-zoom 30s ease-in-out infinite !important;
      will-change: transform;
    }

    .engine-shimmer-animate {
      animation: industrial-heat 4s ease-in-out infinite !important;
      will-change: filter, opacity;
    }

    .engine-scan-animate {
      position: absolute;
      width: 100%;
      height: 12rem;
      left: 0;
      background: linear-gradient(to bottom, transparent, rgba(249, 115, 22, 0.25), transparent);
      animation: industrial-scan 7s linear infinite !important;
      pointer-events: none;
      z-index: 10;
    }

    .carbon-overlay {
      background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
      opacity: 0.08;
      pointer-events: none;
    }

    .glass-hud {
      background: rgba(15, 23, 42, 0.15);
      /* More transparent */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
